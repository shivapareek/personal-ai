name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0"

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk PersonalAI.apk

      - name: Smoke test free AI with short and long prompts (informational)
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, time, urllib.request, random
          def ask(system, n_hist):
              msgs = [{"role": "system", "content": system}]
              for i in range(n_hist):
                  msgs.append({"role": "user" if i % 2 == 0 else "assistant", "content": "aaj kaam bahut tha, thoda thak gaya hu yaar"})
              msgs.append({"role": "user", "content": "aaj padhai ka mood nahi hai"})
              body = json.dumps({"model": "openai", "stream": False, "seed": random.randint(1, 10**6), "messages": msgs}).encode()
              req = urllib.request.Request("https://text.pollinations.ai/openai", body, {"Content-Type": "application/json"})
              t = time.time()
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      txt = json.load(r)["choices"][0]["message"]["content"]
                      return "HTTP 200 in %.1fs: %s" % (time.time() - t, txt[:90])
              except urllib.error.HTTPError as e:
                  return "HTTP %d in %.1fs" % (e.code, time.time() - t)
          short = "You are Aisha, a caring girlfriend. Reply in 1-2 short Hindi sentences in Devanagari, no emojis."
          long_ = short + " " + ("Remember details, be warm, answer questions properly, vary wording. " * 40)
          print("compact prompt (%d chars, 6 msgs):" % len(short), ask(short, 6))
          print("long prompt (%d chars, 20 msgs):" % len(long_), ask(long_, 20))
          PY

      - name: Smoke test neural voice with reference edge-tts library (informational)
        continue-on-error: true
        run: |
          pip install -q edge-tts
          edge-tts --text "नमस्ते" --voice hi-IN-SwaraNeural --write-media /tmp/ref.mp3
          ls -la /tmp/ref.mp3

      - name: Smoke test neural voice (EdgeTts.java on plain JVM, informational)
        continue-on-error: true
        run: |
          JARS=$(find ~/.gradle/caches/modules-2 -name 'okhttp-4.12.0.jar' -o -name 'okio-jvm-*.jar' -o -name 'kotlin-stdlib-*.jar' | tr '\n' ':')
          mkdir -p /tmp/edge
          javac -encoding UTF-8 -d /tmp/edge -cp "$JARS" app/src/main/java/com/shiva/personalai/EdgeTts.java
          java -cp "/tmp/edge:$JARS" com.shiva.personalai.EdgeTts "नमस्ते! मैं आपकी पर्सनल साथी हूँ।" /tmp/edge/hi.mp3 hi-IN-SwaraNeural
          file /tmp/edge/hi.mp3
          ls -la /tmp/edge/hi.mp3

      - uses: actions/upload-artifact@v4
        with:
          name: PersonalAI-apk
          path: PersonalAI.apk

      - name: Publish APK as GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v5.0-build${{ github.run_number }}"
          gh release create "$TAG" PersonalAI.apk \
            --repo "${{ github.repository }}" \
            --title "Personal AI APK (build ${{ github.run_number }})" \
            --notes "Android APK built from commit ${{ github.sha }}. Download PersonalAI.apk below and install it on your phone." \
            --latest
