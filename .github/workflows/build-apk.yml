name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0"

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk PersonalAI.apk

      - name: Probe free AI models, latency, streaming and rate limits (informational)
        continue-on-error: true
        run: |
          echo "== models =="; curl -sS --max-time 30 https://text.pollinations.ai/models | python3 -c "import sys,json; d=json.load(sys.stdin); [print(m.get('name'), '|', m.get('description','')[:60], '| tier', m.get('tier'), '| reasoning', m.get('reasoning')) for m in d]" || true
          for M in openai openai-fast mistral llama gemini qwen-coder; do
            T0=$(date +%s.%N)
            R=$(curl -sS --max-time 40 -o /tmp/r.json -w "%{http_code}" -X POST https://text.pollinations.ai/openai -H "Content-Type: application/json" \
              -d "{\"model\":\"$M\",\"max_tokens\":120,\"messages\":[{\"role\":\"user\",\"content\":\"Hindi me ek line me batao: aaj padhai ka mood nahi hai, kya karu?\"}]}")
            T1=$(date +%s.%N)
            echo "$M -> HTTP $R in $(python3 -c "print(round($T1-$T0,2))")s : $(python3 -c "import json;d=json.load(open('/tmp/r.json'));print(d.get('model'), '|', d['choices'][0]['message']['content'][:90])" 2>/dev/null || head -c 200 /tmp/r.json)"
          done
          echo "== burst of 4 back-to-back requests =="
          for i in 1 2 3 4; do curl -sS --max-time 40 -o /dev/null -w "req $i HTTP %{http_code} %{time_total}s\n" -X POST https://text.pollinations.ai/openai -H "Content-Type: application/json" -d '{"model":"openai-fast","messages":[{"role":"user","content":"say hi"}]}'; done
          echo "== streaming (time to first byte) =="
          curl -sS -N --max-time 40 -o /tmp/s.txt -w "stream HTTP %{http_code} ttfb %{time_starttransfer}s total %{time_total}s\n" -X POST https://text.pollinations.ai/openai -H "Content-Type: application/json" -d '{"model":"openai-fast","stream":true,"messages":[{"role":"user","content":"Tell me two short sentences about chai."}]}'
          head -c 700 /tmp/s.txt; echo

      - name: Smoke test neural voice with reference edge-tts library (informational)
        continue-on-error: true
        run: |
          pip install -q edge-tts
          edge-tts --text "नमस्ते" --voice hi-IN-SwaraNeural --write-media /tmp/ref.mp3
          ls -la /tmp/ref.mp3

      - name: Smoke test neural voice (EdgeTts.java on plain JVM, informational)
        continue-on-error: true
        run: |
          JARS=$(find ~/.gradle/caches/modules-2 -name 'okhttp-4.12.0.jar' -o -name 'okio-jvm-*.jar' -o -name 'kotlin-stdlib-*.jar' | tr '\n' ':')
          mkdir -p /tmp/edge
          javac -encoding UTF-8 -d /tmp/edge -cp "$JARS" app/src/main/java/com/shiva/personalai/EdgeTts.java
          java -cp "/tmp/edge:$JARS" com.shiva.personalai.EdgeTts "नमस्ते! मैं आपकी पर्सनल साथी हूँ।" /tmp/edge/hi.mp3 hi-IN-SwaraNeural
          file /tmp/edge/hi.mp3
          ls -la /tmp/edge/hi.mp3

      - uses: actions/upload-artifact@v4
        with:
          name: PersonalAI-apk
          path: PersonalAI.apk

      - name: Publish APK as GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v4.0-build${{ github.run_number }}"
          gh release create "$TAG" PersonalAI.apk \
            --repo "${{ github.repository }}" \
            --title "Personal AI APK (build ${{ github.run_number }})" \
            --notes "Android APK built from commit ${{ github.sha }}. Download PersonalAI.apk below and install it on your phone." \
            --latest
