name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0"

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk PersonalAI.apk

      - name: Smoke test free AI endpoint as the app calls it (informational)
        continue-on-error: true
        run: |
          for EXTRA in '' ',"reasoning_effort":"low"'; do
            curl -sS --max-time 60 -o /tmp/r.json -w "free AI${EXTRA:+ +low reasoning}: HTTP %{http_code} in %{time_total}s\n" -X POST https://text.pollinations.ai/openai \
              -H "Content-Type: application/json" \
              -d "{\"model\":\"openai\",\"stream\":false,\"seed\":$RANDOM$EXTRA,\"messages\":[{\"role\":\"system\",\"content\":\"Reply in one short Hindi sentence.\"},{\"role\":\"user\",\"content\":\"aaj padhai ka mood nahi hai\"}]}"
            python3 -c "import json;print('  ->', json.load(open('/tmp/r.json'))['choices'][0]['message']['content'][:120])" || head -c 300 /tmp/r.json
          done

      - name: Smoke test neural voice with reference edge-tts library (informational)
        continue-on-error: true
        run: |
          pip install -q edge-tts
          edge-tts --text "नमस्ते" --voice hi-IN-SwaraNeural --write-media /tmp/ref.mp3
          ls -la /tmp/ref.mp3

      - name: Smoke test neural voice (EdgeTts.java on plain JVM, informational)
        continue-on-error: true
        run: |
          JARS=$(find ~/.gradle/caches/modules-2 -name 'okhttp-4.12.0.jar' -o -name 'okio-jvm-*.jar' -o -name 'kotlin-stdlib-*.jar' | tr '\n' ':')
          mkdir -p /tmp/edge
          javac -encoding UTF-8 -d /tmp/edge -cp "$JARS" app/src/main/java/com/shiva/personalai/EdgeTts.java
          java -cp "/tmp/edge:$JARS" com.shiva.personalai.EdgeTts "नमस्ते! मैं आपकी पर्सनल साथी हूँ।" /tmp/edge/hi.mp3 hi-IN-SwaraNeural
          file /tmp/edge/hi.mp3
          ls -la /tmp/edge/hi.mp3

      - uses: actions/upload-artifact@v4
        with:
          name: PersonalAI-apk
          path: PersonalAI.apk

      - name: Publish APK as GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v4.1-build${{ github.run_number }}"
          gh release create "$TAG" PersonalAI.apk \
            --repo "${{ github.repository }}" \
            --title "Personal AI APK (build ${{ github.run_number }})" \
            --notes "Android APK built from commit ${{ github.sha }}. Download PersonalAI.apk below and install it on your phone." \
            --latest
